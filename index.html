<!doctype html>
<html lang="th">
<head>
<title>Cabal TH Report</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  (function () {
    var saved = '';
    try { saved = localStorage.getItem('cabal_theme') || ''; } catch (e) {}
    var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="config.js?v=2"></script>
<meta charset="utf-8">
<style>
  :root {
    color-scheme:light;
    --bg:#f4f6f9; --surface:#ffffff; --surface-2:#eef1f5; --ink:#171b24; --muted:#5b6777; --line:#e1e6ec;
    --brand:#2f5bea; --on-brand:#ffffff; --ok:#0f7a4d; --ok-bg:#dcf5e8; --warn:#955400; --warn-bg:#fff0d4;
    --cyan:#0b7f93; --bad:#c22f2f; --bad-bg:#fde6e6; --info:#1c64d1; --info-bg:#dfebff; --today:#e8f0ff; --shadow:0 1px 2px rgba(20,28,40,.06),0 8px 24px rgba(20,28,40,.05);
  }
  :root[data-theme="dark"] {
    color-scheme:dark;
    --bg:#0e1218; --surface:#171c25; --surface-2:#212835; --ink:#e8ecf2; --muted:#9dabbb; --line:#2c3543;
    --brand:#86a8ff; --on-brand:#0e1218; --ok:#62d6a1; --ok-bg:#12352a; --warn:#f2b552; --warn-bg:#3a2b10;
    --cyan:#34d8ec; --bad:#f79090; --bad-bg:#3e1d20; --info:#8fb8ff; --info-bg:#1b2c4a; --today:#1b2a45; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.55 "Noto Sans Thai","Segoe UI",sans-serif; font-variant-numeric:tabular-nums; }
  header { position:sticky; top:0; z-index:20; background:var(--surface); border-bottom:1px solid var(--line); padding:10px 24px; display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; }
  h1 { font-size:18px; line-height:1.3; margin:0; font-weight:700; letter-spacing:-.01em; }
  .spacer { flex:1; }
  .muted { color:var(--muted); font-size:12px; }
  #last { min-width:0; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  nav { display:flex; gap:4px; padding:14px 24px 0; overflow-x:auto; }
  nav button { flex:none; border:0; background:none; padding:8px 16px; min-height:36px; border-radius:999px; cursor:pointer; color:var(--muted); font:inherit; font-weight:500; }
  nav button:hover { background:var(--surface-2); color:var(--ink); }
  nav button.on { background:var(--brand); color:var(--on-brand); font-weight:600; }
  main { padding:14px 24px 40px; }
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px; overflow-x:auto; box-shadow:var(--shadow); }
  .tools { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; align-items:center; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:16px; }
  .kpi { display:block; width:100%; text-align:left; background:var(--surface-2); border:1px solid transparent; border-radius:10px; padding:10px 14px; color:inherit; font:inherit; }
  button.kpi { cursor:pointer; }
  button.kpi:hover { border-color:var(--brand); }
  .kpi span { display:block; color:var(--muted); font-size:12px; }
  .kpi b { font-size:22px; line-height:1.3; font-weight:700; }
  .kpi small { color:var(--muted); font-size:13px; font-weight:400; }
  .kpi .bar { margin-top:6px; }
  table { border-collapse:collapse; width:100%; }
  th,td { padding:9px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; }
  th { color:var(--muted); font-size:12px; font-weight:600; white-space:nowrap; }
  input,select,textarea,button.b { font:inherit; min-height:36px; padding:6px 11px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); }
  input[type=checkbox] { min-height:0; width:16px; height:16px; accent-color:var(--brand); vertical-align:-3px; }
  button.b { cursor:pointer; font-weight:500; white-space:nowrap; }
  button.b:hover { background:var(--surface-2); }
  button.p, button.p:hover { background:var(--brand); border-color:var(--brand); color:var(--on-brand); }
  button.p:hover { filter:brightness(1.08); }
  button:disabled { opacity:.55; cursor:progress; }
  :focus-visible { outline:2px solid var(--brand); outline-offset:1px; }
  input.n { width:78px; }
  .meter { min-width:112px; }
  .bar { height:6px; border-radius:3px; background:var(--line); overflow:hidden; margin-top:3px; }
  .bar i { display:block; height:100%; background:var(--brand); }
  .bar.full i { background:var(--ok); }
  .tag { font-size:12px; padding:1px 8px; border-radius:10px; background:var(--surface-2); white-space:nowrap; }
  .tag.bad { color:var(--bad); background:var(--bad-bg); } .tag.ok { color:var(--ok); background:var(--ok-bg); } .tag.warn { color:var(--warn); background:var(--warn-bg); }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:14px; }
  .card { border:1px solid var(--line); border-radius:12px; padding:14px; background:var(--surface); }
  .card.done { opacity:.55; }
  .card pre { white-space:pre-wrap; font:inherit; margin:10px 0; }
  a { color:var(--brand); }
  button.link { border:0; background:none; padding:0; color:var(--brand); font:inherit; font-weight:600; cursor:pointer; text-align:left; }
  tr.day td { background:var(--surface-2); font-weight:600; }
  tr.day.multi td { background:var(--warn-bg); }
  tr.off td { color:var(--muted); }
  .tag.live { color:var(--bad); background:var(--bad-bg); } .tag.clip { color:var(--info); background:var(--info-bg); }
  .facts { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px 16px; margin-bottom:12px; }
  .facts div span { display:block; color:var(--muted); font-size:12px; }
  table.grid { display:block; overflow-x:auto; border-collapse:separate; border-spacing:0; width:100%; font-size:12px; border:1px solid var(--line); border-radius:10px; }
  table.grid th, table.grid td { padding:4px 5px; border-bottom:1px solid var(--line); border-right:1px solid var(--line); }
  table.grid thead th { background:var(--surface-2); }
  table.grid tbody tr:hover td, table.grid tbody tr:hover td.name { background:var(--surface-2); }
  table.grid .name { position:sticky; left:0; z-index:2; background:var(--surface); min-width:164px; white-space:nowrap; box-shadow:1px 0 0 var(--line); }
  table.grid thead th.name { background:var(--surface-2); }
  table.grid .num { text-align:center; min-width:30px; }
  table.grid .day-cell { text-align:center; min-width:38px; padding:3px 2px; }
  table.grid .weekend { color:var(--bad); }
  table.grid .today, table.grid thead th.today { background:var(--today); }
  table.grid tfoot td, table.grid tfoot td.name { font-weight:700; background:var(--surface-2); border-bottom:0; }
  table.grid .full { color:var(--ok); font-weight:700; }
  table.grid .over { color:var(--cyan); font-weight:700; }
  table.grid .late { color:var(--bad); font-weight:700; }
  table.grid .remark { max-width:240px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chip { border:0; border-radius:5px; padding:2px 5px; font:inherit; font-weight:700; cursor:pointer; white-space:nowrap; background:var(--surface-2); color:var(--ink); }
  .chip.p-review { background:var(--warn-bg); color:var(--warn); }
  .chip.many { box-shadow:0 0 0 2px var(--ink); }
  .notice { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; justify-content:space-between; background:var(--warn-bg); color:var(--warn); border-radius:10px; padding:10px 14px; margin-bottom:14px; font-weight:600; }
  .notice .b { color:var(--ink); }
  .manual { margin-bottom:20px; }
  .manual h2 { font-size:15px; margin:0; }
  .manual > p { margin:0 0 10px; }
  .manual-head { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .manual-actions { display:flex; gap:6px; align-items:center; }
  .manual-clip.rejected a { color:var(--muted); }
  .manual-clip { display:grid; grid-template-columns:1fr auto; gap:2px 8px; align-items:center; padding:7px 0; border-top:1px solid var(--line); }
  .manual-clip > .muted { grid-column:1 / -1; }
  .manual-clip a { min-width:0; overflow-wrap:anywhere; }
  .manual-list { max-height:280px; overflow:auto; }
  a.link { font-weight:600; color:var(--brand); text-decoration:none; }
  a.link:hover { text-decoration:underline; }
  span.link.plain { font-weight:600; }
  a.chip { display:inline-block; text-decoration:none; }
  span.chip { display:inline-block; cursor:default; }
  .job-menu { position:fixed; z-index:40; background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); padding:6px; width:min(380px,calc(100vw - 16px)); max-height:50vh; overflow:auto; }
  .job-menu a, .job-menu span { display:block; padding:7px 9px; border-radius:6px; color:var(--ink); text-decoration:none; }
  .job-menu a:hover { background:var(--surface-2); }
  body.locked header, body.locked nav, body.locked main { display:none; }
  #login { display:none; min-height:100vh; align-items:center; justify-content:center; padding:16px; }
  body.locked #login { display:flex; }
  .login-card { background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:32px; width:100%; max-width:380px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:12px; }
  .login-card p { margin:0; }
  #status { display:none; align-items:center; gap:7px; font-size:12px; font-weight:600; color:var(--info); background:var(--info-bg); padding:4px 11px; border-radius:999px; white-space:nowrap; }
  #status.show { display:inline-flex; }
  #status i { width:11px; height:11px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion:reduce) { #status i { animation:none; } }
  #toast { position:fixed; right:16px; bottom:16px; z-index:30; background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; display:none; max-width:min(420px,calc(100vw - 32px)); box-shadow:var(--shadow); }
  @media (max-width:640px) {
    header { padding:10px 16px; position:static; }
    #last { order:5; flex-basis:100%; }
    .spacer { display:none; }
    .actions { width:100%; }
    .actions button { flex:1; }
    nav { padding:12px 16px 0; }
    main { padding:12px 16px 32px; }
    .panel { padding:12px; }
    .cards { grid-template-columns:1fr; }
  }
</style>
</head>
<body class="locked">
<div id="login"><div class="login-card"><h1>Cabal TH Report</h1><p class="muted" id="login-msg">เข้าสู่ระบบด้วยบัญชี Google ที่ได้รับสิทธิ์</p><div id="login-btn"></div></div></div>
<header>
  <h1>Cabal TH Report</h1>
  <select id="month" aria-label="เดือน"></select>
  <span class="muted" id="last"></span>
  <span id="status" role="status"><i></i><span id="status-text"></span></span>
  <span class="spacer"></span>
  <div class="actions">
    <button class="b" id="theme" type="button"></button>
    <button class="b" id="sync" type="button">อัปเดตลงชีทสรุปยอดไลฟ์</button>
    <button class="b p" id="refresh" type="button">อัปเดตจาก YouTube</button>
  </div>
</header>
<nav id="tabs"></nav>
<main><div class="panel" id="view">กำลังโหลด…</div></main>
<div id="toast" role="status"></div>
<script>
var S = { data:null, tab:'overview', pic:'', q:'', report:'', reportGame:'', copyPick:{}, reviewPick:{}, };

/** The web app runs in a sandboxed frame, so the older copy command is tried first. */
function copyText(text, message) {
  var area = document.createElement('textarea');
  area.value = text;
  area.style.position = 'fixed';
  area.style.opacity = '0';
  document.body.appendChild(area);
  area.select();
  var ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  document.body.removeChild(area);
  if (ok) return toast(message);
  navigator.clipboard.writeText(text).then(function () { toast(message); }, function () { toast('คัดลอกไม่สำเร็จ'); });
}

/** One row for the streamer report tab, columns A:M of "NEW ZRC (PC)". */
function reportTsvRow(v) {
  var clean = function (x) { return String(x === undefined || x === null ? '' : x).replace(/[\t\r\n]+/g, ' ').trim(); };
  var title = clean(v.title);
  if (/^[=+\-@]/.test(title)) title = '​' + title;
  var chat = clean(v.chat), reaction = clean(v.reaction);
  var engagement = chat === '' && reaction === '' ? '' : (Number(chat) || 0) + (Number(reaction) || 0);
  return [title, clean(v.url), v.type === 'Live' ? 'Live' : 'Video', '', v.date, Number(String(v.date).slice(5, 7)),
    clean(v.views), clean(v.likes), clean(v.average), clean(v.peak), chat, reaction, engagement].join('\t');
}
var PF = ['PC','M','RE'];
var TABS = [['overview','ภาพรวม'],['review','ต้องตรวจ'],['remind','เตือนวันจันทร์'],['report','รายงาน'],['history','ย้อนหลัง'],['quota','โควตา']];

function el(tag, attrs, kids) {
  var n = document.createElement(tag);
  Object.keys(attrs || {}).forEach(function (k) {
    if (k === 'on') Object.keys(attrs.on).forEach(function (e) { n.addEventListener(e, attrs.on[e]); });
    else if (k === 'text') n.textContent = attrs[k];
    else if (attrs[k] !== undefined && attrs[k] !== false) n.setAttribute(k, attrs[k]);
  });
  [].concat(kids || []).forEach(function (c) { if (c !== null && c !== undefined) n.append(c); });
  return n;
}
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(function () { t.style.display = 'none'; }, 3500);
}
var Auth = {
  token:'',
  set:function (t) { this.token = t; try { sessionStorage.setItem('cabal_id_token', t); } catch (e) {} },
  clear:function () { this.token = ''; try { sessionStorage.removeItem('cabal_id_token'); } catch (e) {} },
  restore:function () {
    var t = '';
    try { t = sessionStorage.getItem('cabal_id_token') || ''; } catch (e) {}
    if (!t) return false;
    try {
      var exp = JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).exp;
      if (exp * 1000 < Date.now() + 60000) { this.clear(); return false; }
    } catch (e) { this.clear(); return false; }
    this.token = t;
    return true;
  }
};
function showLogin(message) {
  document.body.classList.add('locked');
  if (message) document.getElementById('login-msg').textContent = message;
  if (!CABAL_CONFIG.clientId) return;
  var start = function () {
    if (!window.google || !google.accounts) return setTimeout(start, 200);
    google.accounts.id.initialize({ client_id:CABAL_CONFIG.clientId, callback:function (r) { Auth.set(r.credential); call('getData', []); } });
    google.accounts.id.renderButton(document.getElementById('login-btn'), { theme:'outline', size:'large' });
  };
  start();
}
var Work = { loading:'', saves:0, syncing:false, timer:null, queue:Promise.resolve(), generation:0 };
var WORK_LABELS = { getData:'กำลังโหลดข้อมูล…', refreshNow:'กำลังดึงจาก YouTube… ประมาณ 1 นาที', syncSheetNow:'กำลังลงชีทสรุปยอดไลฟ์…' };
function paintStatus() {
  var text = Work.saves ? 'กำลังบันทึก ' + Work.saves + ' รายการ…'
    : Work.loading ? Work.loading
    : (Work.timer || Work.syncing) ? 'กำลังอัปเดตยอดลงชีท…' : '';
  document.getElementById('status-text').textContent = text;
  document.getElementById('status').classList.toggle('show', !!text);
}
function apiPost(fn, args) {
  return fetch(CABAL_CONFIG.apiUrl, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body:JSON.stringify({ token:Auth.token, action:fn, args:args })
  }).then(function (r) { return r.json(); }).then(function (res) {
    if (res.ok) return res.data;
    if (res.error === 'unauthorized') {
      Auth.clear();
      showLogin('บัญชีนี้ไม่มีสิทธิ์ หรือการเข้าสู่ระบบหมดอายุ กรุณาเข้าสู่ระบบใหม่');
    }
    throw new Error(res.error);
  });
}
function call(fn, args, msg) {
  if (!Auth.token) return showLogin();
  var buttons = ['refresh', 'sync'].map(function (id) { return document.getElementById(id); });
  buttons.forEach(function (b) { b.disabled = true; });
  Work.loading = WORK_LABELS[fn] || 'กำลังบันทึก…';
  paintStatus();
  var done = function () {
    buttons.forEach(function (b) { b.disabled = false; });
    Work.loading = '';
    paintStatus();
  };
  apiPost(fn, args).then(function (data) {
    done();
    document.body.classList.remove('locked');
    S.data = data;
    render();
    if (fn === 'syncSheetNow' && data.sheetSync && data.sheetSync.error) toast('ลงชีทไม่สำเร็จ: ' + data.sheetSync.error);
    else if (msg) toast(msg);
  }).catch(function (e) {
    done();
    if (e.message !== 'unauthorized') toast('เกิดข้อผิดพลาด: ' + e.message);
  });
}

/** Keeps the page and its counters in step with one video, before the server has answered. */
function applyVideoLocal(videoId, patch) {
  var v = S.data.videos.filter(function (x) { return x.videoId === videoId; })[0];
  if (!v) return;
  var row = S.data.rows.filter(function (r) { return r.streamer === v.streamer; })[0];
  var before = v.status === 'count' ? v.platform : '';
  Object.keys(patch).forEach(function (k) { v[k] = patch[k]; });
  var after = v.status === 'count' ? v.platform : '';
  if (row && before !== after) {
    if (before) row.done[before]--;
    if (after) row.done[after]++;
  }
}
function saveVideoFast(v, patch) {
  var local = {};
  Object.keys(patch).forEach(function (k) { local[k] = patch[k]; });
  if (patch.status !== undefined || patch.platform !== undefined) local.locked = 'TRUE';
  var undo = {};
  Object.keys(local).forEach(function (k) { undo[k] = v[k]; });
  var id = v.videoId;
  applyVideoLocal(id, local);
  if (patch.status !== undefined || patch.platform !== undefined) render();
  Work.saves++;
  Work.generation++;
  clearTimeout(Work.timer);
  Work.timer = null;
  paintStatus();
  Work.queue = Work.queue.then(function () {
    return apiPost('saveVideo', [id, patch]);
  }).catch(function (e) {
    applyVideoLocal(id, undo);
    render();
    if (e.message !== 'unauthorized') toast('บันทึกไม่สำเร็จ: ' + e.message);
  }).then(function () {
    Work.saves--;
    if (!Work.saves) scheduleSheetSync();
    paintStatus();
  });
}
function addManualFast(input) {
  var month = S.data.month;
  var tempId = 'temp-' + Date.now();
  var shown = input.date.slice(0, 7) === month;
  var row = S.data.rows.filter(function (r) { return r.streamer === input.streamer; })[0];
  if (shown) {
    S.data.videos.push({ videoId:tempId, streamer:input.streamer, title:input.title || 'เพิ่มเอง', url:input.url || '', date:input.date, month:month,
      type:input.type, platform:input.platform, status:'count', manual:'TRUE', locked:'TRUE', views:Number(input.views) || 0, likes:'' });
    if (row) row.done[input.platform]++;
    render();
  }
  toast('เพิ่มงานแล้ว');
  Work.saves++;
  var generation = ++Work.generation;
  paintStatus();
  Work.queue = Work.queue.then(function () {
    return apiPost('addManualVideo', [input, month]);
  }).then(function (data) {
    if (generation === Work.generation) { S.data = data; render(); }
  }).catch(function (e) {
    if (shown) {
      S.data.videos = S.data.videos.filter(function (v) { return v.videoId !== tempId; });
      var current = S.data.rows.filter(function (r) { return r.streamer === input.streamer; })[0];
      if (current) current.done[input.platform]--;
      render();
    }
    if (e.message !== 'unauthorized') toast('เพิ่มงานไม่สำเร็จ: ' + e.message);
  }).then(function () {
    Work.saves--;
    paintStatus();
  });
}
function markManualChecked(check, week, month) {
  var next = !check.done;
  var setDone = function (value) {
    (S.data.manualChecks || []).forEach(function (c) { if (c.streamer === check.streamer) c.done = value; });
    render();
  };
  setDone(next);
  Work.saves++;
  Work.generation++;
  paintStatus();
  Work.queue = Work.queue.then(function () {
    return apiPost('setReminded', ['CHECK:' + check.streamer, week, next, month]);
  }).catch(function (e) {
    setDone(!next);
    if (e.message !== 'unauthorized') toast('บันทึกไม่สำเร็จ: ' + e.message);
  }).then(function () {
    Work.saves--;
    paintStatus();
  });
}
/** One sheet update after a burst of decisions, instead of one per click. */
function scheduleSheetSync() {
  clearTimeout(Work.timer);
  Work.timer = setTimeout(function () {
    Work.timer = null;
    Work.syncing = true;
    paintStatus();

    var gamePick = el('select', { 'aria-label':'เกมที่แสดง', on:{ change:function (e) { S.reportGame = e.target.value; render(); } } },
      [['', 'ทุกเกม']].concat(PF.map(function (x) { return [x, x]; })).map(function (o) {
        return el('option', { value:o[0], selected:S.reportGame === o[0] ? 'selected' : false, text:o[1] });
      }));
    var picked = list.filter(isPicked);
    var copy = el('button', { class:'b p', text:'คัดลอก ' + picked.length + ' แถวไปชีทสตรีมเมอร์', on:{ click:function () {
      if (!picked.length) return toast('ยังไม่ได้เลือกแถว');
      copyText(picked.map(reportTsvRow).join('\n'), 'คัดลอกแล้ว ไปวางที่คอลัมน์ A แถวว่างแถวแรกในชีทสตรีมเมอร์');
    } } });
    var input = function (v, k, label) {
      return el('input', { class:'n', type:'number', min:'0', value:v[k], 'aria-label':label, disabled:S.data.readOnly ? 'disabled' : false, on:{ change:function (e) { var o = {}; o[k] = e.target.value; saveVideoFast(v, o); } } });
    };
    return [ el('div', { class:'tools' }, [pick, gamePick, copy,
        el('button', { class:'b', text:'เลือกทั้งหมด', on:{ click:function () { setAll(true); } } }),
        el('button', { class:'b', text:'ไม่เลือก', on:{ click:function () { setAll(false); } } })]),
      S.data.readOnly ? null : manualForm(S.report),
      table(['เลือก','วันที่','คลิป','แบบ','เกม','วิว','ไลก์','Average','Peak','Chat','Reaction'], list.map(function (v) {
        var box = el('input', { type:'checkbox', 'aria-label':'เลือกแถวนี้', checked:isPicked(v) ? 'checked' : false, on:{ change:function (e) { S.copyPick[v.videoId] = e.target.checked; render(); } } });
        return el('tr', {}, [ td(box), td(v.date), td(safeLink(v.url, v.title)), td(v.type), td(el('span', { class:'tag', text:v.platform })), td(v.views), td(v.likes),
          td(input(v,'average','Average')), td(input(v,'peak','Peak')), td(input(v,'chat','Chat')), td(input(v,'reaction','Reaction')) ]);
      })) ];
  },
  history: function () {
    if (!History.rows) {
      loadHistory();
      return el('p', { class:'muted', text:History.error ? 'โหลดไม่สำเร็จ: ' + History.error : 'กำลังโหลดข้อมูลย้อนหลัง…' });
    }
    var channels = History.rows.map(function (r) { return r[H.streamer]; }).filter(function (v, i, all) { return all.indexOf(v) === i; }).sort();
    var results = el('div', {});
    var option = function (value, label, current) { return el('option', { value:value, selected:value === current ? 'selected' : false, text:label }); };
    var channel = el('select', { 'aria-label':'ช่อง', on:{ change:function (e) { History.channel = e.target.value; History.month = ''; paintHistory(results); } } },
      [option('', 'ทุกช่อง', History.channel)].concat(channels.map(function (c) { return option(c, c, History.channel); })));
    var game = el('select', { 'aria-label':'เกม', on:{ change:function (e) { History.game = e.target.value; paintHistory(results); } } },
      [['', 'ทุกเกม'], ['PC', 'PC'], ['M', 'Mobile'], ['RE', 'Revolution']].map(function (g) { return option(g[0], g[1], History.game); }));
    var search = el('input', { type:'search', placeholder:'ค้นหาชื่องาน', 'aria-label':'ค้นหาชื่องาน', value:History.search, on:{ input:function (e) { History.search = e.target.value; paintHistory(results); } } });
    paintHistory(results);
    return [ el('div', { class:'tools' }, [channel, game, search]), results ];
  },
  quota: function () {
    var keys = ['basePC','adjPC','baseM','adjM','baseRE','adjRE'];
    var edits = {};
    var save = el('button', { class:'b p', text:'บันทึกโควตา', on:{ click:function () {
      var out = Object.keys(edits).map(function (k) { return edits[k]; });
      if (out.length) call('saveQuota', [S.data.month, out], 'บันทึกแล้ว');
    } } });
    var locked = S.data.readOnly ? 'disabled' : false;
    return [ el('div', { class:'tools' }, [locked ? null : save, el('span', { class:'muted', text:'ปกติ = โควตาเดือนนี้, ปรับ = ยอดทบหรือยอดหัก (ติดลบได้)' })]),
      table(['สตรีมเมอร์','PC ปกติ','PC ปรับ','M ปกติ','M ปรับ','RE ปกติ','RE ปรับ','หมายเหตุ'], S.data.rows.map(function (r) {
        var change = function (k, val) { edits[r.streamer] = edits[r.streamer] || { streamer:r.streamer }; edits[r.streamer][k] = val; };
        var cells = keys.map(function (k) { return td(el('input', { class:'n', type:'number', value:r.q[k], disabled:locked, 'aria-label':r.streamer + ' ' + k, on:{ change:function (e) { change(k, e.target.value); } } })); });
        return el('tr', {}, [td(el('b', { text:r.streamer }))].concat(cells, td(el('input', { value:r.q.note, disabled:locked, 'aria-label':'หมายเหตุ', on:{ change:function (e) { change('note', e.target.value); } } }))));
      })) ];
  }
};

function render() {
  var d = S.data;
  var month = document.getElementById('month');
  month.replaceChildren.apply(month, d.months.map(function (m) { return el('option', { value:m, selected:m === d.month ? 'selected' : false, text:m }); }));
  document.getElementById('last').textContent = (d.lastRefresh ? 'อัปเดตล่าสุด ' + new Date(d.lastRefresh).toLocaleString('th-TH') : 'ยังไม่เคยอัปเดต') + (d.failures.length ? ' · ดึงไม่สำเร็จ ' + d.failures.length + ' รายการ' : '') + (!d.sheetSync ? '' : d.sheetSync.error ? ' · ลงชีทสรุปยอดไม่สำเร็จ: ' + d.sheetSync.error : ' · ลงชีทสรุปยอดแล้ว' + (d.sheetSync.conflicts ? ' (ช่องที่กรอกเองไม่ตรง ' + d.sheetSync.conflicts + ')' : '') + (d.sheetSync.missing.length ? ' (ไม่พบแถว: ' + d.sheetSync.missing.join(', ') + ')' : '')) + (d.docSync && d.docSync.errors.length ? ' · อัปเดต Docs ไม่สำเร็จ: ' + d.docSync.errors.join(', ') : '');
  var pending = d.videos.filter(function (v) { return v.status === 'review'; }).length + manualPending().length;
  var shown = TABS.filter(function (t) { return !d.readOnly || (t[0] !== 'review' && t[0] !== 'remind'); });
  if (!shown.some(function (t) { return t[0] === S.tab; })) S.tab = 'overview';
  document.getElementById('sync').disabled = !!d.readOnly;
  var tabs = document.getElementById('tabs');
  tabs.replaceChildren.apply(tabs, shown.map(function (t) {
    return el('button', { class:S.tab === t[0] ? 'on' : '', text:t[1] + (t[0] === 'review' && pending ? ' (' + pending + ')' : ''), on:{ click:function () { S.tab = t[0]; render(); } } });
  }));
  var view = document.getElementById('view');
  var archiveNote = d.readOnly && S.tab !== 'history' ? el('div', { class:'notice' }, el('span', { text:'เดือนย้อนหลัง ดูได้อย่างเดียว · โควตาจากชีททีม · งานจากแท็บรายงานที่ไม่ได้ซ่อน ยอดบางช่องจึงอาจต่ำกว่าชีทเดิม' })) : null;
  view.replaceChildren.apply(view, [archiveNote].concat(VIEWS[S.tab]()).filter(Boolean));
}
document.getElementById('month').addEventListener('change', function (e) { call('getData', [e.target.value]); });
function paintTheme() {
  document.getElementById('theme').textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? 'ธีมสว่าง' : 'ธีมมืด';
}
paintTheme();
document.getElementById('theme').addEventListener('click', function () {
  var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('cabal_theme', next); } catch (e) {}
  paintTheme();
});
document.getElementById('sync').addEventListener('click', function () { if (S.data) call('syncSheetNow', [S.data.month], 'ลงชีทสรุปยอดไลฟ์แล้ว'); });
document.getElementById('refresh').addEventListener('click', function () { call('refreshNow', [S.data && S.data.month], 'อัปเดตแล้ว'); });
if (!CABAL_CONFIG.clientId || !CABAL_CONFIG.apiUrl) showLogin('ระบบยังตั้งค่าไม่เสร็จ');
else if (Auth.restore()) call('getData', []);
else showLogin();
</script>
</body>
</html>
